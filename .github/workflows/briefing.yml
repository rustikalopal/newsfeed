name: Morgenlage Briefing

on:
  schedule:
    - cron: "23 23 * * *"   # ~01:23 deutsche Sommerzeit (Soll) -> mit Verzug grob morgens
    - cron: "23 0 * * *"    # ~01:23 deutsche Winterzeit (Soll)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Heute schon erzeugt?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manuell ausgelöst – läuft."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(date -u +%F)"
          gen="$(python3 -c "import json; print((json.load(open('docs/briefing.json')).get('generated_at') or '')[:10])" 2>/dev/null || echo '')"
          if [ "$gen" = "$today" ]; then
            echo "Heute ($today) bereits erzeugt – überspringe."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Heute noch nicht erzeugt (zuletzt: ${gen:-nie}) – läuft."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Briefing recherchieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MORGENLAGE_MODEL: ${{ vars.MORGENLAGE_MODEL || 'claude-sonnet-4-6' }}
        run: python briefing.py

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Frisches Briefing sichern, damit es nach dem Abgleich mit dem
          # Remote-Stand garantiert erhalten bleibt (konfliktfrei).
          cp docs/briefing.json /tmp/briefing.json
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/briefing.json docs/briefing.json
            git add docs/briefing.json
            if git diff --staged --quiet; then
              echo "Keine Änderung – nichts zu committen."
              exit 0
            fi
            git commit -m "Briefing $(date -u +%Y-%m-%d)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push erfolgreich."
              exit 0
            fi
            echo "Push-Versuch $i fehlgeschlagen – neuer Versuch …"
            sleep 3
          done
          echo "Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
