name: Morgenlage Briefing

on:
  schedule:
    - cron: "0 4 * * *"   # 06:00 Sommerzeit
    - cron: "0 5 * * *"   # 06:00 Winterzeit
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Berlin date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (lokal $(TZ=Europe/Berlin date +%H) Uhr)" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Briefing recherchieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MORGENLAGE_MODEL: ${{ vars.MORGENLAGE_MODEL || 'claude-sonnet-4-6' }}
        run: python briefing.py

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/briefing.json
          if git diff --staged --quiet; then
            echo "Keine Änderung – nichts zu committen."
          else
            git commit -m "Briefing $(date -u +%Y-%m-%d)"
            git push
          fi
