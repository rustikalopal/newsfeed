name: Morgenlage Briefing

on:
  schedule:
    # 04:30 UTC ~ 06:30 Uhr deutscher Zeit (Sommerzeit). Bei Bedarf anpassen.
    - cron: "30 4 * * *"
  workflow_dispatch: {}   # erlaubt manuelles Auslösen im Actions-Tab

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Briefing recherchieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MORGENLAGE_MODEL: ${{ vars.MORGENLAGE_MODEL || 'claude-sonnet-4-6' }}
        run: python briefing.py

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/briefing.json
          if git diff --staged --quiet; then
            echo "Keine Änderung – nichts zu committen."
          else
            git commit -m "Briefing $(date -u +%Y-%m-%d)"
            git push
          fi
